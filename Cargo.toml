[package]
name = "coderova"
version = "0.1.0"
edition = "2024"
description = "Local, evidence-oriented source callgraph explorer"
license = "MIT"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
lsp-types = "0.97"
url = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "io-util", "time"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17.2", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
