<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeRova · 源码工作台</title><link rel="icon" type="image/svg+xml" href="/brand/coderova-mark.svg"><script src="/workbench/theme.js"></script><link rel="stylesheet" href="/vendor/components/controls.css"><link rel="stylesheet" href="/workbench/style.css"><link rel="stylesheet" href="/workbench/interaction.css"><link rel="stylesheet" href="/vendor/monaco/monaco-preview.css"><link rel="stylesheet" href="/workbench/components.css"><link rel="stylesheet" href="/vendor/components/status.css"></head>
<body>
<a class="skip-link" href="#reader">跳到调用图</a>
<header><a class="brand" href="/" aria-label="CodeRova 项目主页"><img src="/brand/coderova-mark.svg" width="30" height="30" alt="" aria-hidden="true"><span>CodeRova</span></a><div class="header-actions"><select data-search="false" id="appearance" aria-label="配色主题"><option value="light">亮色</option><option value="dark">深色</option></select><button id="storage-settings" type="button">存储设置</button><a id="enter-workbench" href="/?view=workbench">进入工作台</a><a href="/">项目主页</a></div></header>
<section id="project-home" class="project-home" hidden role="main" tabindex="-1" aria-labelledby="home-title"></section>
<div class="workspace" hidden>
  <aside id="project-library" class="library" aria-label="项目与调用图">
    <div class="section-title sidebar-heading">项目资料库 <span id="graph-count"></span></div>
    <input id="filter" type="search" placeholder="搜索项目、分组或调用图…" aria-label="搜索项目、分组或调用图" autocomplete="off" spellcheck="false">
    <nav id="catalog" aria-label="调用图目录"></nav>

  </aside>
  <main id="reader" tabindex="-1">
    <div id="resize-library" class="sidebar-resizer sidebar-resizer-left" role="separator" aria-orientation="vertical" aria-label="调整项目栏宽度" aria-controls="project-library" tabindex="0" title="拖动调整项目栏宽度；方向键微调，双击复位"></div>
    <div id="resize-inspector" class="sidebar-resizer sidebar-resizer-right" role="separator" aria-orientation="vertical" aria-label="调整详情栏宽度" aria-controls="source-inspector" tabindex="0" title="拖动调整详情栏宽度；方向键微调，双击复位"></div>
    <button id="toggle-library" class="sidebar-handle sidebar-handle-left" aria-expanded="true" aria-controls="project-library" aria-label="收起项目栏" title="收起项目栏"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m10 3-5 5 5 5"/></svg></button>
    <button id="toggle-inspector" class="sidebar-handle sidebar-handle-right" aria-expanded="true" aria-controls="source-inspector" aria-label="收起证据栏" title="收起证据栏"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
    <section class="heading"><div><h1 id="title">选择一个调用图</h1></div>    <div id="edit-bar" hidden class="edit-bar" aria-label="图修改"><span id="edit-state" role="status">已保存</span><button id="restore-hidden" hidden>恢复隐藏</button><button id="discard-edits" disabled>放弃修改</button><button id="save-edits" class="primary" disabled>保存</button></div></section>
    <div class="workbench-toolbar">
    <div class="node-toolbar" role="toolbar" aria-label="节点导航">
      <div class="node-search">    <input id="symbol-filter" type="search" placeholder="搜索节点" aria-label="搜索节点">
    <select id="symbols" aria-label="选择节点"><option>尚未加载调用图</option></select>
    <button id="symbols-more" hidden>加载更多选项</button><span id="symbol-load-status" role="status" aria-live="polite"></span>
</div>
      <div class="node-stepper"><button id="node-prev" title="上一节点" aria-label="上一节点"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m12 5-5 5 5 5"/></svg></button><button id="node-center" title="居中当前节点">居中当前节点</button><button id="node-next" title="下一节点" aria-label="下一节点"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg></button></div>
    </div>
    <div class="graph-controls" aria-label="图展示范围">
      <button id="fit" disabled>适应画布</button>
      <fieldset id="direction" class="direction-switch" aria-label="布局方向"><label><input type="radio" name="direction" value="TB"><span>纵向</span></label><label><input type="radio" name="direction" value="LR" checked><span>横向</span></label></fieldset>
      <details id="display-settings" class="display-settings"><summary><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 4h12M2 12h12"/><circle cx="6" cy="4" r="2"/><circle cx="10" cy="12" r="2"/></svg>展示设置</summary><div class="settings-body" role="group" aria-labelledby="settings-title">
      <div class="settings-heading"><strong id="settings-title">展开范围</strong><span>按需探索调用链</span></div>
      <div class="settings-row"><label for="window-size">每次展开</label><div class="settings-value"><input id="window-size" type="number" min="1" step="1" value="50" aria-label="展开数量" aria-describedby="window-help">
      <select data-search="false" id="window-unit" aria-label="展开单位"><option value="nodes">个节点</option><option value="layers" selected>层调用</option></select></div></div>
      <p id="window-help">点击节点展开时使用此范围，原始调用数据保留。</p>
      <div class="settings-footer"><button id="apply-window">重置视图<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button></div>
      </div></details>
      <details class="editor-settings"><summary>源码跳转</summary><div class="editor-settings-body">      <button id="click-source" type="button" aria-pressed="false" title="开启后，点击节点或精确调用连线时打开编辑器">点击跳转：关</button>
      <select data-search="false" id="source-editor" aria-label="源码编辑器" title="源码跳转使用的编辑器；IDEA 需注册 idea:// 协议"><option value="vscode">VS Code</option><option value="idea">IntelliJ IDEA</option></select>
</div></details>
      <details id="lsp-settings" class="lsp-settings"><summary><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="2" width="12" height="5" rx="1.5"/><rect x="2" y="9" width="12" height="5" rx="1.5"/><path d="M4 4.5h1M4 11.5h1M8 4.5h4M8 11.5h4"/></svg>语言服务器</summary><div class="lsp-settings-body" role="group" aria-labelledby="lsp-panel-title">
        <h2 id="lsp-panel-title">语言服务器</h2><p class="lsp-project">当前项目 <span id="lsp-project-name">—</span></p>
        <div id="graph-services" aria-label="当前项目语言服务器"></div>
        <p class="lsp-panel-help">供当前项目的源码解析与调用采集使用；采集中需先停止任务，再停止服务器。</p>
      </div></details>
    <details id="graph-details" class="graph-details"><summary>采集信息<span id="collection-indicator" aria-live="polite"></span></summary><div class="graph-details-body"><strong id="analysis-brief">说明与采集状态</strong><p id="summary">左侧按项目列出所有调用图。</p>
    <details id="coverage" hidden><summary id="coverage-title"></summary><p id="coverage-scope"></p><ul id="coverage-issues"></ul></details>
    <details id="resume-panel" hidden aria-label="断点续采"><summary id="resume-summary">采集任务</summary>
<div id="active-collection" class="active-collection" hidden role="status" tabindex="-1"><span id="active-collection-status">正在采集</span><button id="resume-stop" hidden>停止采集</button><div class="collection-result-actions" id="collection-result-actions" hidden><button id="resume-discard">放弃</button><button id="resume-refresh">预览</button><button id="resume-accept" class="collection-result">采纳并保存</button></div></div>
      <p id="resume-status" role="status" aria-live="polite"></p>
      <small>结果暂存，采纳后写入图文件。</small>
    </details>
    </div></details>
    </div>
    </div>


    <div id="status" role="status" aria-live="polite">正在读取项目目录…</div>
    <div id="canvas" aria-label="调用关系画布"></div>
    <footer><span id="stats">—</span></footer>
  </main>
  <aside id="source-inspector" class="inspector" aria-label="详情">
    <div id="inspector-heading" class="section-title sidebar-heading">详情</div>
    <h2 id="selection-title">未选择节点</h2>
    <div id="source-location"></div>
    <button id="open-source" type="button" hidden>在编辑器打开</button>
    <details id="selection-notes" hidden><summary>说明</summary><p id="selection-description"></p></details>
    <div id="node-actions-panel"></div>

    <div id="relations"></div>
    <section id="source" aria-label="源码预览" hidden></section>
  </aside>
</div>
<script type="module" src="/workbench/bootstrap.js"></script>
</body></html>
