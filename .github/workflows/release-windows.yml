name: Windows portable release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Build frontend
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build:frontend
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tests = @(Get-ChildItem frontend/workbench/*.test.mjs | ForEach-Object FullName)
          node --test @tests
      - name: Verify backend
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build portable binary
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked
      - name: Package and smoke test
        run: |
          $version = '0.1.0-dev'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME }
          ./scripts/package_windows.ps1 -Version $version
          python tests/windows_package_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: target/packages/*.zip*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem target/packages/*.zip* | ForEach-Object FullName)
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title "Callgraph Visualizer $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
